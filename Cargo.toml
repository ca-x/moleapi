[workspace]
members = ["crates/core", "crates/server", "crates/formats", "desktop"]
default-members = ["crates/core", "crates/server", "crates/formats"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
