name: Classic Dubbo interoperability QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classic-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/dubbo-qa/java/pom.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build independent official Apache provider and consumer
        run: mvn -B --strict-checksums -f tools/dubbo-qa/java/pom.xml package dependency:copy-dependencies -DincludeScope=runtime
      - name: Record exact tool and dependency versions
        shell: bash
        run: |
          set -euo pipefail
          java -version > tools/dubbo-qa/java/versions.txt 2>&1
          mvn -version >> tools/dubbo-qa/java/versions.txt
          cargo --version >> tools/dubbo-qa/java/versions.txt
          sha256sum "$HOME/.m2/repository/org/apache/dubbo/dubbo/3.3.6/dubbo-3.3.6.jar" tools/dubbo-qa/rust/Cargo.lock >> tools/dubbo-qa/java/versions.txt
          mvn -B -f tools/dubbo-qa/java/pom.xml dependency:tree -DoutputFile=target/dependency-tree.txt
      - name: Start official classic provider
        shell: bash
        run: |
          set -euo pipefail
          cd tools/dubbo-qa/java
          java -cp 'target/classes:target/dependency/*' fixture.Provider 20880 > provider.log 2>&1 &
          echo "$!" > provider.pid
          for attempt in {1..120}; do
            if grep -q '^READY 20880$' provider.log; then exit 0; fi
            if ! kill -0 "$(cat provider.pid)" 2>/dev/null; then cat provider.log; exit 1; fi
            sleep 0.5
          done
          cat provider.log
          exit 1
      - name: Prove fixture with official Java client
        run: |
          set -euo pipefail
          java -cp 'tools/dubbo-qa/java/target/classes:tools/dubbo-qa/java/target/dependency/*' fixture.Consumer 20880 | tee tools/dubbo-qa/java/official-client.log
      - name: Prove official generic invocation route
        run: |
          set -euo pipefail
          java -cp 'tools/dubbo-qa/java/target/classes:tools/dubbo-qa/java/target/dependency/*' fixture.GenericConsumer 20880 | tee tools/dubbo-qa/java/generic-client.log
      - name: Build isolated official Dubbo worker
        run: mvn -B --strict-checksums -f tools/dubbo-worker/pom.xml package
      - name: Call bounded worker against the official provider
        run: |
          python3 tools/dubbo-worker/verify.py --java "$(readlink -f "$(command -v java)")" --jar "$PWD/tools/dubbo-worker/target/moleapi-dubbo-worker-0.1.0.jar" --port 20880 --output tools/dubbo-qa/java/worker-evidence.json
      - name: Call through Rust checked host and original worker
        run: |
          set -euo pipefail
          cargo run --locked -p moleapi-protocols --example dubbo-runtime-fixture -- "$(readlink -f "$(command -v java)")" "$PWD/tools/dubbo-worker/target/moleapi-dubbo-worker-0.1.0.jar" 20880 | tee tools/dubbo-qa/java/rust-host.log
      - name: Build hosted server with production frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
          cargo build --locked -p moleapi-server
      - name: Verify hosted startup watcher
        run: python3 -m unittest tools/dubbo-worker/test_verify_server.py
      - name: Verify hosted owner and saved-run behavior
        run: |
          python3 tools/dubbo-worker/verify-server.py --server "$PWD/target/debug/moleapi-server" --java "$(readlink -f "$(command -v java)")" --jar "$PWD/tools/dubbo-worker/target/moleapi-dubbo-worker-0.1.0.jar" --provider-port 20880 --output tools/dubbo-qa/java/hosted-evidence.json
      - name: Probe candidate Rust codec against official provider
        shell: bash
        run: |
          set -uo pipefail
          cargo run --locked --manifest-path tools/dubbo-qa/rust/Cargo.toml -- 20880 > tools/dubbo-qa/java/candidate.log 2>&1
          printf '%s\n' "$?" > tools/dubbo-qa/java/candidate-exit.txt
          cat tools/dubbo-qa/java/candidate.log
          python3 tools/dubbo-qa/verdict.py tools/dubbo-qa/java/candidate.log tools/dubbo-qa/java/candidate-exit.txt | tee tools/dubbo-qa/java/verdict.json
      - name: Stop owned provider
        if: always()
        shell: bash
        run: |
          if test -f tools/dubbo-qa/java/provider.pid; then
            kill "$(cat tools/dubbo-qa/java/provider.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dubbo-classic-wire
          path: |
            tools/dubbo-qa/java/provider.log
            tools/dubbo-qa/java/official-client.log
            tools/dubbo-qa/java/generic-client.log
            tools/dubbo-qa/java/candidate.log
            tools/dubbo-qa/java/candidate-exit.txt
            tools/dubbo-qa/java/verdict.json
            tools/dubbo-qa/java/versions.txt
            tools/dubbo-qa/java/target/dependency-tree.txt
            tools/dubbo-qa/java/worker-evidence.json
            tools/dubbo-qa/java/rust-host.log
            tools/dubbo-qa/java/hosted-evidence.json
            tools/dubbo-worker/target/moleapi-dubbo-worker-0.1.0.jar
          if-no-files-found: warn
  zookeeper-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            tools/dubbo-worker/pom.xml
            tools/dubbo-discovery-qa/java/pom.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare exact direct worker and Apache ZooKeeper fixture
        run: |
          python3 scripts/prepare_dubbo_worker.py --maven "$(command -v mvn)"
          mvn -B --strict-checksums -f tools/dubbo-discovery-qa/java/pom.xml package dependency:copy-dependencies -DincludeScope=runtime
      - name: Discover, admit and call an original registered provider
        run: |
          python3 tools/dubbo-discovery-qa/verify.py --java "$(readlink -f "$(command -v java)")" --jar "$PWD/vendor/dubbo-worker/current/engine.jar" --output "$RUNNER_TEMP/zookeeper-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dubbo-zookeeper-wire
          path: |
            ${{ runner.temp }}/zookeeper-evidence.json
            ${{ runner.temp }}/zookeeper-evidence.held.log
            ${{ runner.temp }}/zookeeper-evidence.auth.log
            ${{ runner.temp }}/zookeeper-evidence.complete.log
          if-no-files-found: warn
  nacos-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            tools/dubbo-worker/pom.xml
            tools/dubbo-nacos-qa/java/pom.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare official Nacos 2.5.1 server and Apache fixture
        run: |
          python3 scripts/prepare_dubbo_worker.py --maven "$(command -v mvn)"
          mkdir -p "$RUNNER_TEMP/nacos-qa"
          curl -fL --retry 3 --retry-delay 3 -o "$RUNNER_TEMP/nacos-qa/nacos-server-2.5.1.tar.gz" \
            https://github.com/alibaba/nacos/releases/download/2.5.1/nacos-server-2.5.1.tar.gz
          mvn -B --strict-checksums -f tools/dubbo-nacos-qa/java/pom.xml package dependency:copy-dependencies -DincludeScope=runtime
      - name: Verify checked Nacos discovery and product Dubbo call
        run: |
          python3 tools/dubbo-nacos-qa/verify.py --java "$(readlink -f "$(command -v java)")" \
            --jar "$PWD/vendor/dubbo-worker/current/engine.jar" \
            --archive "$RUNNER_TEMP/nacos-qa/nacos-server-2.5.1.tar.gz" \
            --output "$RUNNER_TEMP/nacos-evidence.json"
          python3 tools/dubbo-nacos-qa/verify.py --auth --java "$(readlink -f "$(command -v java)")" \
            --jar "$PWD/vendor/dubbo-worker/current/engine.jar" \
            --archive "$RUNNER_TEMP/nacos-qa/nacos-server-2.5.1.tar.gz" \
            --output "$RUNNER_TEMP/nacos-auth-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dubbo-nacos-wire
          path: |
            ${{ runner.temp }}/nacos-evidence.json
            ${{ runner.temp }}/nacos-evidence.server.log
            ${{ runner.temp }}/nacos-evidence.held.log
            ${{ runner.temp }}/nacos-evidence.namespace.log
            ${{ runner.temp }}/nacos-evidence.metadata.log
            ${{ runner.temp }}/nacos-evidence.complete.log
            ${{ runner.temp }}/nacos-evidence.namespace-complete.log
            ${{ runner.temp }}/nacos-auth-evidence.json
            ${{ runner.temp }}/nacos-auth-evidence.server.log
            ${{ runner.temp }}/nacos-auth-evidence.auth-held.log
            ${{ runner.temp }}/nacos-auth-evidence.auth-namespace.log
            ${{ runner.temp }}/nacos-auth-evidence.auth-complete.log
            ${{ runner.temp }}/nacos-auth-evidence.auth-namespace-complete.log
          if-no-files-found: warn
  metadata-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/dubbo-metadata-qa/java/pom.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build official Apache metadata center fixture
        run: mvn -B --strict-checksums -f tools/dubbo-metadata-qa/java/pom.xml package dependency:copy-dependencies -DincludeScope=runtime
      - name: Compare provider report with checked Rust preview
        run: |
          python3 tools/dubbo-metadata-qa/verify.py --java "$(readlink -f "$(command -v java)")" \
            --output "$RUNNER_TEMP/metadata-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dubbo-metadata-wire
          path: |
            ${{ runner.temp }}/metadata-evidence.json
            ${{ runner.temp }}/metadata-evidence.held.log
            ${{ runner.temp }}/metadata-evidence.auth.log
            ${{ runner.temp }}/metadata-evidence.complete.log
            ${{ runner.temp }}/metadata-evidence.auth-complete.log
          if-no-files-found: warn
