name: Server and desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      objc_qa:
        description: Run only native Objective-C protobuf interoperability QA
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f Cargo.toml ] && [ -f crates/server/Cargo.toml ] && [ -f desktop/tauri.conf.json ] && [ -f web/package-lock.json ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Application implementation is pending; no server or desktop artifact was built.' >> "$GITHUB_STEP_SUMMARY"
          fi
  server:
    needs: source
    if: needs.source.outputs.available == 'true' && inputs.objc_qa != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: moleapi-server
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: moleapi-server
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: moleapi-server
          - runner: macos-latest
            target: aarch64-apple-darwin
            binary: moleapi-server
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: moleapi-server.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: python scripts/prepare_openapi_generator.py
      - run: cargo build --locked --release -p moleapi-server --target ${{ matrix.target }}
      - name: Verify standalone server worker dispatch
        run: python scripts/check-script-worker.py target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Archive embedded server executable
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf artifacts/moleapi-server-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
  desktop:
    needs: source
    if: needs.source.outputs.available == 'true' && inputs.objc_qa != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Linux desktop packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev rpm
      - run: npm --prefix web ci
      - name: Generate platform icons from provided transparent logo
        working-directory: desktop
        run: ../web/node_modules/.bin/tauri icon ../assets/brand/logo.png --output icons
      - run: python scripts/prepare_openapi_generator.py
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          tauriScript: ../web/node_modules/.bin/tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify desktop worker without opening a GUI
        run: python scripts/check-script-worker.py target/${{ matrix.target }}/release/moleapi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: error
  objc-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.objc_qa == true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: objc-qa-${{ matrix.runner }}
          save-if: 'true'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: tools/projects/objc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install explicit official QA compilers and server libraries
        run: |
          brew install grpc protobuf
          python -m pip install grpcio==1.84.0 grpcio-tools==1.76.0 protobuf==6.33.6
          mkdir -p "$RUNNER_TEMP/objc-tools"
          python - <<'PY'
          import os, sys
          from pathlib import Path
          import grpc_tools.protoc
          target = Path(os.environ['RUNNER_TEMP']) / 'objc-tools/protoc'
          target.write_text(f'#!{sys.executable}\nimport sys\nfrom grpc_tools.protoc import entrypoint\nsys.exit(entrypoint())\n')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'MOLEAPI_OBJC_QA_PYTHON={sys.executable}\n')
          PY
          chmod +x "$RUNNER_TEMP/objc-tools/protoc"
          brew list --versions grpc protobuf > "$RUNNER_TEMP/objc-tools/versions.txt"
          protoc --version >> "$RUNNER_TEMP/objc-tools/versions.txt"
          python -m pip freeze >> "$RUNNER_TEMP/objc-tools/versions.txt"
          shasum -a 256 "$(command -v protoc)" "$(command -v grpc_objective_c_plugin)" >> "$RUNNER_TEMP/objc-tools/versions.txt"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: python scripts/prepare_openapi_generator.py
      - run: cargo build --locked -p moleapi-server
      - name: Generate original source and descriptor clients and server
        shell: bash
        run: |
          cargo run --locked -p moleapi-generation --example fixture_protobuf -- "$RUNNER_TEMP/objc-clients" "$PWD/target/debug/moleapi-server" "$(command -v protoc)" "$(command -v grpc_objective_c_plugin)" objc
          cargo run --locked -p moleapi-generation --example fixture_protobuf -- "$RUNNER_TEMP/objc-server" "$PWD/target/debug/moleapi-server" "$RUNNER_TEMP/objc-tools/protoc" "$RUNNER_TEMP/objc-tools/protoc" python
          MOLEAPI_CODEGEN_TEST_PROTOC="$(command -v protoc)" MOLEAPI_CODEGEN_TEST_GRPC_OBJC="$(command -v grpc_objective_c_plugin)" cargo test --locked -p moleapi-generation --test projects official_objc_plugin_emits_original_apple_models_and_four_rpc_interfaces -- --ignored
      - name: Compile and call all four RPC modes from both representations
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/tools/projects/objc/Gemfile
        run: |
          bundle exec "$MOLEAPI_OBJC_QA_PYTHON" tools/projects/verify-protobuf-objc.py "$RUNNER_TEMP/objc-clients/source" --server-dir "$RUNNER_TEMP/objc-server/source"
          bundle exec "$MOLEAPI_OBJC_QA_PYTHON" tools/projects/verify-protobuf-objc.py "$RUNNER_TEMP/objc-clients/descriptor" --server-dir "$RUNNER_TEMP/objc-server/descriptor"
      - name: Compile and run original Objective-C models with Foundation
        run: |
          for dialect in 3.0.3 3.1.0; do
            cargo run --locked -p moleapi-generation --example fixture_models -- "$RUNNER_TEMP/objc-models-$dialect" "$PWD/target/debug/moleapi-server" "$(command -v java)" "$dialect" model-objc
            python tools/models/verify-objc.py --fixtures "$RUNNER_TEMP/objc-models-$dialect" --dialect "$dialect" --xcrun /usr/bin/xcrun
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objc-qa-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/objc-clients/**/runtime-evidence.json
            ${{ runner.temp }}/objc-clients/**/Podfile.lock
            ${{ runner.temp }}/objc-clients/**/moleapi-generation.json
            ${{ runner.temp }}/objc-tools/versions.txt
            ${{ runner.temp }}/objc-models-*/**/runtime-evidence.json
            ${{ runner.temp }}/objc-models-*/**/moleapi-generation.json
          if-no-files-found: warn
