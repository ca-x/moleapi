name: Application CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect application sources
        run: |
          if [ -f Cargo.toml ] && [ -f crates/server/Cargo.toml ] && [ -f web/package-lock.json ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Research/specification phase: application sources are not published yet.' >> "$GITHUB_STEP_SUMMARY"
          fi
  check:
    needs: source
    if: needs.source.outputs.available == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/prepare_openapi_generator.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release -p moleapi-server
  database:
    needs: source
    if: needs.source.outputs.available == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moleapi
          POSTGRES_PASSWORD: moleapi_test_only
          POSTGRES_DB: moleapi
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: moleapi_test_only
          MYSQL_DATABASE: moleapi
          MYSQL_USER: moleapi
          MYSQL_PASSWORD: moleapi_test_only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pmoleapi_test_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: database-integration
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Run the same migration/auth/isolation/CAS suite against all three engines
        env:
          MOLEAPI_TEST_POSTGRES_URL: postgresql://moleapi:moleapi_test_only@127.0.0.1:5432/moleapi
          MOLEAPI_TEST_MYSQL_URL: mysql://moleapi:moleapi_test_only@127.0.0.1:3306/moleapi
        run: cargo test --locked -p moleapi-server --test database -- --nocapture --test-threads=1
      - name: Prepare pinned SQL generator and native database consumers
        run: |
          python scripts/prepare_openapi_generator.py
          python -m venv "$RUNNER_TEMP/sql-model-tools"
          "$RUNNER_TEMP/sql-model-tools/bin/python" -m pip install -r tools/models/sql-requirements.txt
          cargo build --locked -p moleapi-server
      - name: Execute original model DDL on PostgreSQL and MySQL
        env:
          MOLEAPI_MODEL_QA_POSTGRES_URL: postgresql://moleapi:moleapi_test_only@127.0.0.1:5432/postgres
          MOLEAPI_MODEL_QA_MYSQL_URL: mysql://root:moleapi_test_only@127.0.0.1:3306/
        run: |
          for dialect in 3.0.3 3.1.0; do
            cargo run --locked -p moleapi-generation --example fixture_models -- "$RUNNER_TEMP/sql-models-$dialect" "$PWD/target/debug/moleapi-server" "$(command -v java)" "$dialect" mysql-schema,postgresql-schema
            "$RUNNER_TEMP/sql-model-tools/bin/python" tools/models/verify-sql.py --fixtures "$RUNNER_TEMP/sql-models-$dialect" --dialect "$dialect" --target postgresql-schema --url-env MOLEAPI_MODEL_QA_POSTGRES_URL
            "$RUNNER_TEMP/sql-model-tools/bin/python" tools/models/verify-sql.py --fixtures "$RUNNER_TEMP/sql-models-$dialect" --dialect "$dialect" --target mysql-schema --url-env MOLEAPI_MODEL_QA_MYSQL_URL
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-model-native-evidence
          path: |
            ${{ runner.temp }}/sql-models-*/**/runtime-evidence.json
            ${{ runner.temp }}/sql-models-*/**/moleapi-generation.json
          if-no-files-found: warn
