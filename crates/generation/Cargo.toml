[package]
name = "moleapi-generation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tonic-prost-build = "=0.14.6"
prost = "0.14"
prost-types = "0.14"
diffy = {version="=0.5.2",features=["std"]}
progenitor = {version="=0.15.0",default-features=false}
openapiv3 = "2"
oas3 = "0.22"
semver = "1"
prettyplease = "0.2"
syn = {version="2",features=["full"]}
serde_yaml_ng = "0.10"
sha2 = "0.10"
zip = {version="4",default-features=false,features=["deflate"]}
tempfile = "3"
tokio.workspace = true
tokio-util = {version="0.7",features=["rt"]}
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
moleapi-core = { path = "../core" }
moleapi-formats = { path = "../formats" }
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }
url = "2"
base64 = "0.22"

[build-dependencies]
sha2 = "0.10"
serde_json.workspace = true
