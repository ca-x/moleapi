[package]
name = "moleapi-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["web"]
web = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
oauth2 = {version="=5.0.0",default-features=false}
moleapi-generation = { path = "../generation" }
tokio-util = { version = "0.7", features = ["rt"] }
tonic.workspace = true
moleapi-protocols = { path = "../protocols" }
moleapi-core = { path = "../core" }
moleapi-data = { path = "../data" }
moleapi-script-runtime = { path = "../script-runtime" }
moleapi-formats = { path = "../formats" }
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
uuid.workspace = true
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls"] }
argon2 = "0.5"
aho-corasick = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
chrono = "0.4"
base64 = "0.22"
url = "2"
percent-encoding = "2"
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path", "debug-embed"] }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
hyper = {version="1",features=["server","http1"]}
sspi = {version="=0.23.0",default-features=false,features=["ring"]}
http-body-util = "0.1"
hawk = "=5.0.1"
bytes = "1"
a2a-rs = { version = "=0.10.0", default-features = false, features = ["jsonrpc-server", "http-server"] }
a2a-types = "=0.2.0"
a2a-types-legacy = { package = "a2a-types", version = "=0.1.1" }
async-trait = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
rmcp = { version = "=3.5.0", features = ["server", "transport-io", "transport-streamable-http-server", "elicitation"] }

rcgen = "0.14"
tonic-reflection.workspace = true
prost.workspace = true
prost-types = "0.14"
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
async-graphql = { version = "=7.2.1", default-features = false }
async-graphql-axum = "=7.2.1"
axum = { workspace = true, features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[build-dependencies]
sha2 = "0.10"
