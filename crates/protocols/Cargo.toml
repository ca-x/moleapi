[package]
name = "moleapi-protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
prost.workspace = true
prost-types = "0.14"
prost-reflect.workspace = true
tonic.workspace = true
tonic-reflection.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-stream = { version = "0.1", features = ["net"] }
moleapi-core = { path = "../core" }
graphql-ws-client.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
reqwest.workspace = true
futures-util = "0.3"
base64 = "0.22"
chrono = "0.4"
eventsource-stream = "0.2.3"
reqwest-websocket = "0.5.1"
tungstenite = { version = "0.27", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

rust_socketio = { version = "=0.6.0", features = ["async"] }
rust_engineio = { version = "=0.6.0", features = ["async"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
native-tls = "0.2"
bytes = "1"
rustls-native-certs = "0.8"

rumqttc = { version = "=0.25.1", default-features = false, features = ["use-rustls-no-provider", "websocket"] }

rmcp = { version = "=3.5.0", default-features = false, features = ["client", "macros", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
http = "1"
sse-stream = "0.2.6"
process-wrap = { version = "10", features = ["tokio1"] }
jsonschema = { version = "=0.58.5", default-features = false }


a2a-client = { path = "../../vendor/a2a-client" }
a2a-client-legacy = { path = "../../vendor/a2a-client-legacy" }
a2a-types = "=0.2.0"
a2a-types-legacy = { package = "a2a-types", version = "=0.1.1" }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
tonic-prost = "0.14"
prost-types = "0.14"
axum = { workspace = true, features = ["ws"] }
