[package]
name = "moleapi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
csv = "=1.4.0"
no-proxy = {version="=0.3.7",default-features=false}
p12-keystore = "=0.3.2"
rustls-pemfile = "2"
hyper-http-proxy = {version="=1.2.0",default-features=false,features=["rustls-tls-webpki-roots"]}
tower-service = "0.3"
headers = "0.4"
tokio-socks = "0.5"
jose-rs = {version="=0.9.0",default-features=false}
data-url = "=0.3.2"
p256 = {version="0.13",features=["pem","pkcs8"]}
p384 = {version="0.13",features=["pem","pkcs8"]}
p521 = {version="0.13",features=["pem","pkcs8"]}
tropel-auth = {version="=0.6.0",default-features=false}
chrono = "0.4"
sspi = {version="=0.23.0",default-features=false,features=["ring"]}
hyper = {version="1",features=["client","http1"]}
hyper-util = {version="0.1",features=["tokio"]}
http-body-util = "0.1"
bytes = "1"
tokio-rustls = {version="0.26",default-features=false,features=["ring","tls12"]}
webpki-roots = "1"
x509-parser = "=0.18.1"
www-authenticate = "=0.4.0"
hyperx = "1"
http-auth = {version="=0.1.10",default-features=false}
serde_urlencoded = "0.7"
oauth1-request = { version = "=0.6.1", default-features = false, features = ["std", "hmac-sha1", "rsa-sha1-09"] }
percent-encoding = "2"
hmac = "0.12"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
cookie_store = { version = "=0.22.1", default-features = false }
psl = "=2.1.240"
hawk = "=5.0.1"
aws-sigv4 = { version="=1.4.5", default-features=false, features=["sign-http", "http1"] }
aws-credential-types = "=1.2.14"
http = "1"
oauth2 = {version="=5.0.0",default-features=false}
jsonwebtoken = { version="=11.1.0", default-features=false, features=["rust_crypto","use_pem"] }
digest_auth = "=0.3.1"
pem = "=4.0.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hex = "0.4"
prost.workspace = true
prost-reflect.workspace = true
protox.workspace = true
apollo-parser.workspace = true
cynic-parser.workspace = true
async-graphql-parser.workspace = true
cynic.workspace = true
cynic-introspection.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
uuid.workspace = true
url = "2"
base64 = "0.22"
futures-util = "0.3"

rumqttc = { version = "=0.25.1", default-features = false, features = ["use-rustls-no-provider", "websocket"] }

mime = "0.3"
wsdl = "=0.1.3"
roxmltree = "0.18"
xmltree = "=0.11.0"
quick-xml = "0.38"
xsd-parser = "=1.5.2"

[dev-dependencies]
hyper = {version="1",features=["server","http1","http2"]}
rcgen = "0.14"
sha2 = "0.10"
prost-types = "0.14"
axum = { workspace = true, features = ["multipart"] }
